services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: adarsh
      MYSQL_USER: adarsh
      MYSQL_PASSWORD: adarsh
      MYSQL_DATABASE: bookstore
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uadarsh", "-padarsh"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      ADDR: ":9010"
      BOOKSTORE_DSN: "adarsh:adarsh@tcp(db:3306)/bookstore?charset=utf8&parseTime=True&loc=Local"
    ports:
      - "9010:9010"
    depends_on:
      db:
        condition: service_healthy
